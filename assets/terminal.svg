<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300">
  <defs>
    <clipPath id="w"><rect width="820" height="300" rx="14"/></clipPath>
    <style>
      text{font:15px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .p{fill:#4ade80}.c{fill:#e2e8f0}.k{fill:#94a3b8}.v{fill:#fbbf24}.s{fill:#38bdf8}.m{fill:#f472b6}
      .l{opacity:0;animation:show .01s forwards}
      .l1{animation-delay:.3s}.l2{animation-delay:1.0s}.l3{animation-delay:1.5s}.l4{animation-delay:2.0s}.l5{animation-delay:2.5s}
      .l6{animation-delay:3.2s}.l7{animation-delay:3.7s}.l8{animation-delay:4.2s}.l9{animation-delay:4.9s}
      @keyframes show{to{opacity:1}}
      .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#w)">
    <rect width="820" height="300" fill="#0d1117"/>
    <rect width="820" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="410" y="22" text-anchor="middle" class="k" style="font-size:13px">yashwanth@bengaluru: ~</text>

    <text x="24" y="66" class="l l1"><tspan class="p">➜ </tspan><tspan class="s">~ </tspan><tspan class="c">cat about.json</tspan></text>
    <text x="24" y="94" class="l l2 c">{</text>
    <text x="24" y="118" class="l l3"><tspan class="k">  "building": </tspan><tspan class="v">"multi-agent LLM platform (MCP, RAG, self-hosted LLMs) for DRDO"</tspan><tspan class="c">,</tspan></text>
    <text x="24" y="142" class="l l4"><tspan class="k">  "previously": </tspan><tspan class="v">"digital analytics &amp; ML @ Fidelity Investments"</tspan><tspan class="c">,</tspan></text>
    <text x="24" y="166" class="l l5"><tspan class="k">  "loves": </tspan><tspan class="c">[</tspan><tspan class="v">"SQL"</tspan><tspan class="c">, </tspan><tspan class="v">"Python"</tspan><tspan class="c">, </tspan><tspan class="v">"dashboards"</tspan><tspan class="c">, </tspan><tspan class="v">"agents"</tspan><tspan class="c">, </tspan><tspan class="v">"automation"</tspan><tspan class="c">],</tspan></text>
    <text x="24" y="190" class="l l6"><tspan class="k">  "open_to": </tspan><tspan class="v">"Data / Product Analyst · AI Engineer · Backend roles"</tspan><tspan class="c">,</tspan></text>
    <text x="24" y="214" class="l l7"><tspan class="k">  "next": </tspan><tspan class="m">"financial analysis &amp; equity research"</tspan></text>
    <text x="24" y="238" class="l l8 c">}</text>
    <text x="24" y="272" class="l l9"><tspan class="p">➜ </tspan><tspan class="s">~ </tspan><tspan class="c cur">▋</tspan></text>
